[project]
name = "social-media-agent"
version = "0.1.0"
description = "Freigabegesteuerte Social-Media-Automation für Fußballvereine"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0,<3",
  "alembic>=1.13", "psycopg[binary]>=3.2", "pydantic-settings>=2.5",
  "jinja2>=3.1", "python-multipart>=0.0.12", "itsdangerous>=2.2",
  "pwdlib[argon2]>=0.2", "httpx>=0.27", "beautifulsoup4>=4.12",
  "pillow>=10.4", "playwright>=1.50", "structlog>=24.4", "apscheduler>=3.10,<4",
  "openai>=1.50", "cryptography>=43"
]
[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]
[tool.pytest.ini_options]
testpaths=["tests"]
markers=["postgresql: requires TEST_POSTGRES_URL and a disposable PostgreSQL database"]
[tool.ruff]
line-length=100
target-version="py312"
[build-system]
requires=["setuptools>=75"]
build-backend="setuptools.build_meta"
[tool.setuptools.packages.find]
include=["app*"]
[tool.ruff.lint]
select=["E","F","I","B"]
ignore=["E501","E701","E702","E703","B008"]
