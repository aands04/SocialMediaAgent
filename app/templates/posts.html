{% extends 'base.html' %}{% block content %}<h1>Beiträge und Freigaben</h1><table><tr><th>Mannschaft</th><th>Typ</th><th>Status</th><th>Version</th><th>Bearbeitet</th><th></th></tr>{% for x in items %}<tr><td>{{teams[x.team_id].display_name}}</td><td>{{x.post_type}}</td><td><span class="badge">{{x.status.value}}</span></td><td>{{x.version}}</td><td>{{x.updated_at}}</td><td><a class="button" href="/posts/{{x.id}}">Prüfen</a></td></tr>{% endfor %}</table>{% endblock %}
