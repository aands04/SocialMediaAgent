{% extends 'base.html' %}{% block content %}<h1>Mannschaften</h1><section><h2>Neue Mannschaft</h2><form method="post" class="gridform"><input type="hidden" name="csrf_token" value="{{csrf}}"><label>Interner Name<input name="internal_name" required></label><label>Anzeigename<input name="display_name" required></label><label>Kurzname<input name="short_name" required maxlength="30"></label><label>Slug<input name="slug" required pattern="[a-z0-9-]+"></label><label>Verein<input name="club" required></label><label>FUSSBALL.DE-Link<input name="fussball_url" type="url" required></label><label>Instagram-Seite<select name="instagram_page_id" required>{% for p in pages %}<option value="{{p.id}}">{{p.display_name}}{% if not p.active %} (inaktiv){% endif %}</option>{% endfor %}</select></label><label>Medien-Unterordner<input name="media_subdir" required></label><button>Anlegen</button></form></section><section><h2>Vorhandene Mannschaften</h2><table><tr><th>Name</th><th>Instagram</th><th>Ordner</th><th>Status</th><th>Aktionen</th></tr>{% for x in items %}<tr><td>{{x.display_name}}<small>{{x.slug}}</small></td><td>{{x.instagram_page_id}}</td><td>{{x.media_subdir}}</td><td>{{'aktiv' if x.active else 'inaktiv'}}</td><td><form method="post" action="/teams/{{x.id}}/state"><input type="hidden" name="csrf_token" value="{{csrf}}"><input type="hidden" name="version" value="{{x.version}}"><button name="action" value="toggle">Aktiv umschalten</button><button class="danger" name="action" value="archive">Archivieren</button></form></td></tr>{% endfor %}</table></section>{% endblock %}
