{% extends 'base.html' %}{% block content %}
<section class="login">
  <h1>Neues Passwort festlegen</h1>
  {% if error %}<div class="alert">{{ error }}</div>{% endif %}
  {% if token %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <label>Neues Passwort<input name="password" type="password" minlength="8" maxlength="256" autocomplete="new-password" required></label>
    <label>Neues Passwort wiederholen<input name="password_confirmation" type="password" minlength="8" maxlength="256" autocomplete="new-password" required></label>
    <button>Passwort speichern</button>
  </form>
  {% else %}<p><a href="/password/forgot">Neuen Reset-Link anfordern</a></p>{% endif %}
</section>
{% endblock %}
