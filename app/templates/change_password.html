{% extends 'base.html' %}{% block content %}
<section class="login">
  <h1>Passwort ändern</h1>
  <p>Nach der Änderung werden alle bestehenden Sitzungen beendet.</p>
  {% if error %}<div class="alert">{{ error }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <label>Aktuelles Passwort<input name="current_password" type="password" autocomplete="current-password" required></label>
    <label>Neues Passwort<input name="password" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></label>
    <label>Neues Passwort wiederholen<input name="password_confirmation" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></label>
    <button>Passwort ändern</button>
  </form>
</section>
{% endblock %}
