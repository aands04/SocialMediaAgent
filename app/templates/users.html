{% extends 'base.html' %}{% block content %}<h1>Benutzer und Mannschaftsrechte</h1><form method="post" class="gridform"><input type="hidden" name="csrf_token" value="{{csrf}}"><label>E-Mail<input type="email" name="email" required></label><label>Initialpasswort<input type="password" name="password" minlength="12" required></label><label>Rolle<select name="role">{% for r in ['admin','editor','approver','viewer'] %}<option>{{r}}</option>{% endfor %}</select></label><label><input type="checkbox" name="all_teams" value="true"> Alle Mannschaften</label><button>Benutzer anlegen</button></form>{% for x in items %}<article class="panel"><h2>{{x.email}} <small>{{x.role.value}}</small></h2><form method="post" action="/users/{{x.id}}/teams"><input type="hidden" name="csrf_token" value="{{csrf}}"><label><input type="checkbox" name="all_teams" value="true" {% if x.all_teams %}checked{% endif %}> Zugriff auf alle Mannschaften</label>{% for t in teams %}<label><input type="checkbox" name="team_ids" value="{{t.id}}" {% if (x.id,t.id) in assignments %}checked{% endif %}> {{t.display_name}}</label>{% endfor %}<button>Zuordnung speichern</button></form></article>{% endfor %}{% endblock %}
