<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Facebook-Seite auswählen</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="oauth-result"><h1>Facebook-Seite auswählen</h1><p>Wähle ausschließlich die offizielle Seite deines Vereins. Die Verbindung startet sicher deaktiviert.</p><form method="post" action="/public/meta/channels/oauth/select"><input type="hidden" name="state" value="{{ state }}">{% for page in pages %}<label class="oauth-choice"><input type="radio" name="page_id" value="{{ page.id }}" required><strong>{{ page.name }}</strong><span>{{ 'Beiträge veröffentlichen möglich' if page.can_publish else 'Berechtigung zum Veröffentlichen fehlt' }}</span></label>{% endfor %}<button>Ausgewählte Seite verbinden</button></form></main></body></html>
