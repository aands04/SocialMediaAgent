server {
    listen 80;
    client_max_body_size 20m;

    # Up to 25 player images of at most 20 MiB each plus multipart overhead.
    # Keep the larger limit scoped to this authenticated upload endpoint.
    location ~ ^/media/[A-Za-z0-9_-]+/upload$ {
        client_max_body_size 512m;
        client_body_timeout 300s;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Up to ten carousel images of at most 20 MiB each plus multipart overhead.
    # Keep this larger limit scoped to the authenticated manual-post endpoint.
    location = /posts/manual/new {
        client_max_body_size 205m;
        client_body_timeout 300s;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Text plus multiple AI images can take longer than Nginx's
        # default 60-second upstream timeout.
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
