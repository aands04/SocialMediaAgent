server {
    listen 80;
    server_name _;
    client_max_body_size 1m;

    # Keep the upstream valid when Docker recreates the web container with a
    # different internal address. Only Docker's embedded DNS is queried.
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;
    set $web_backend web:8000;

    location = /public/instagram/oauth/callback {
        access_log off;
        limit_except GET { deny all; }
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://$web_backend;
    }

    location ^~ /public/meta-media/ {
        access_log off;
        limit_except GET { deny all; }
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header X-Powered-By;
        add_header X-Content-Type-Options nosniff always;
        proxy_pass http://$web_backend;
    }

    location / {
        return 404;
    }
}
