services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: socialmedia, POSTGRES_USER: socialmedia, POSTGRES_PASSWORD_FILE: /run/secrets/db_password}
    secrets: [db_password]
    volumes: [db_data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U socialmedia"], interval: 10s, timeout: 5s, retries: 5}
    restart: unless-stopped
  web:
    build: .
    env_file: .env
    depends_on: {db: {condition: service_healthy}}
    volumes: [generated:/app/data/generated, uploads:/app/data/uploads, "${MEDIA_HOST_ROOT:-./data/external-media}:/app/external-media:ro"]
    healthcheck: {test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"], interval: 30s, timeout: 5s, retries: 3}
    restart: unless-stopped
  worker:
    build: .
    command: [python, -m, app.worker]
    env_file: .env
    depends_on: {db: {condition: service_healthy}}
    volumes: [generated:/app/data/generated, uploads:/app/data/uploads, "${MEDIA_HOST_ROOT:-./data/external-media}:/app/external-media:ro"]
    restart: unless-stopped
  proxy:
    image: nginx:1.27-alpine
    volumes: ["./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["${HTTP_PORT:-8080}:80"]
    depends_on: [web]
    restart: unless-stopped
secrets:
  db_password: {file: ./secrets/db_password.txt}
volumes: {db_data: {}, generated: {}, uploads: {}}
