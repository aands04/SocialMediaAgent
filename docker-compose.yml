services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: socialmedia
      POSTGRES_USER: socialmedia
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [db_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U socialmedia -d socialmedia"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  migrate:
    build: .
    command: [/app/scripts/migrate.sh]
    env_file: .env
    environment:
      DATABASE_URL: auto
    secrets: [db_password]
    depends_on:
      db: {condition: service_healthy}
    restart: "no"
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: auto
    secrets: [db_password]
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    volumes:
      - generated:/app/data/generated
      - uploads:/app/data/uploads
      - provider_snapshots:/app/data/provider-snapshots
      - type: bind
        source: ${MEDIA_HOST_ROOT:-./data/external-media}
        target: /app/external-media
        read_only: true
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
  worker:
    build: .
    command: [python, -m, app.worker]
    env_file: .env
    environment:
      DATABASE_URL: auto
    secrets: [db_password]
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    volumes:
      - generated:/app/data/generated
      - uploads:/app/data/uploads
      - provider_snapshots:/app/data/provider-snapshots
      - type: bind
        source: ${MEDIA_HOST_ROOT:-./data/external-media}
        target: /app/external-media
        read_only: true
    healthcheck:
      test: [CMD, python, -c, "from pathlib import Path; import sys,time; p=Path('/tmp/worker-heartbeat'); sys.exit(0 if p.exists() and time.time()-p.stat().st_mtime<90 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
  proxy:
    image: nginx:1.27-alpine
    volumes: ["./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["${HTTP_PORT:-8080}:80"]
    depends_on:
      web: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/health]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
secrets:
  db_password: {file: ./secrets/db_password.txt}
volumes:
  db_data: {}
  generated: {}
  uploads: {}
  provider_snapshots: {}
